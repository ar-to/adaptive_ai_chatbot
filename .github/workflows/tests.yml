name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Live inference tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-cardiffnlp-twitter-roberta-base-sentiment-latest-j-hartmann-emotion-english-distilroberta-base
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -v
